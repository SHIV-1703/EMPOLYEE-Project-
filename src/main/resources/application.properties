# Application Title
spring.application.name=employee-system

# Server Port
server.port=8080

# H2 Database Configuration
# We use an in-memory database to make it easy to run and test without setup
spring.datasource.url=jdbc:h2:mem:employeedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
# update mode will automatically create/update database tables based on our Entity classes
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in the console for debugging and interview explanations
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
# This allows us to view the database through the browser at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
