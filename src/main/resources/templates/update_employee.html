<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System - Update Record</title>
    <!-- Shared typography and styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container form-container">
        <h1>Update Employee Record</h1>

        <!-- Form bound to the 'employee' object. Note we map to POST /saveEmployee -->
        <form action="#" th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
        
            <!-- Hidden field for employee ID. This is critical for updating existing vs creating new. -->
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <input type="text" th:field="*{firstName}" placeholder="First Name" class="form-control" required>
            </div>

            <div class="form-group">
                <input type="text" th:field="*{lastName}" placeholder="Last Name" class="form-control" required>
            </div>

            <div class="form-group">
                <input type="email" th:field="*{email}" placeholder="Email Address" class="form-control" required>
            </div>

            <div class="form-group">
                <input type="text" th:field="*{department}" placeholder="Department (e.g. IT, HR)" class="form-control" required>
            </div>

            <div class="form-group">
                <input type="text" th:field="*{designation}" placeholder="Designation (e.g. Software Engineer)" class="form-control" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-update">Update Employee</button>
                <a class="btn btn-light" th:href="@{/}">Cancel & Back</a>
            </div>

        </form>
    </div>

</body>
</html>
