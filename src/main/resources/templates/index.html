<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <!-- Link to Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to our clean static CSS styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">
        <h1>Employee Dashboard</h1>

        <div class="actions">
            <!-- Link to H2 console for debugging and data validation -->
            <a th:href="@{/h2-console}" class="btn btn-light" target="_blank" style="margin-right: 15px;">
                View Database Console
            </a>
            <!-- Navigate to form for new employee -->
            <a th:href="@{/showNewEmployeeForm}" class="btn btn-primary">
                + Add New Employee
            </a>
        </div>

        <div class="table-responsive">
            <!-- Main visual data table -->
            <table>
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Thymeleaf: Iterator to render each row for employee in list -->
                    <tr th:each="employee : ${listEmployees}">
                        <td th:text="${employee.firstName}">John</td>
                        <td th:text="${employee.lastName}">Doe</td>
                        <td th:text="${employee.email}">john.doe@email.com</td>
                        <td th:text="${employee.department}">IT</td>
                        <td th:text="${employee.designation}">Developer</td>
                        <td>
                            <!-- Action links per row mapping to specific employee IDs -->
                            <a th:href="@{/showFormForUpdate/{id}(id=${employee.id})}" class="btn btn-update btn-sm">Update</a>
                            <!-- Using standard anchor tag for simplicity in this demo. For production, consider form POST/DELETE. -->
                            <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this employee record?');">Delete</a>
                        </td>
                    </tr>
                    
                    <!-- Blank state to display when table is empty -->
                    <tr th:if="${#lists.isEmpty(listEmployees)}">
                        <td colspan="6" class="empty-state">No employees found. Click "Add New Employee" to get started!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
